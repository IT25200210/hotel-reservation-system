<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Front office | Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="d-flex justify-content-between mb-4">
        <h1>Front office</h1>
        <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Sign out</button></form>
    </header>
    <p class="alert alert-warning">Local demonstration: booked and walk-in stays, one agreed currency, no taxes or refunds.</p>
    <p th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></p>

    <section class="card card-body mb-4">
        <h2 class="h4">Walk-in check-in</h2>
        <form th:action="@{/frontoffice/check-in}" method="post" class="row g-3">
            <div class="col-md-3">
                <label for="room" class="form-label">Available room</label>
                <select id="room" name="roomId" class="form-select" required>
                    <option value="">Select a room</option>
                    <option th:each="r : ${rooms}" th:if="${!r.occupied}" th:value="${r.id}" th:text="${r.number}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="guest" class="form-label">Guest name</label>
                <input id="guest" name="guest" maxlength="100" required class="form-control">
            </div>
            <div class="col-md-3">
                <label for="departure" class="form-label">Departure</label>
                <input id="departure" name="departure" type="date" required class="form-control">
            </div>
            <div class="col-md-3">
                <label for="rate" class="form-label">Agreed nightly rate</label>
                <input id="rate" name="rate" type="number" min="0.01" max="9999999999.99" step="0.01" required class="form-control">
            </div>
            <div><button class="btn btn-primary">Check in</button></div>
        </form>
    </section>

    <h2 class="h4">Confirmed reservations</h2>
    <p>Check-in is accepted only on the booked arrival date.</p>
    <input type="text" id="reservationSearch" class="form-control mb-2"
           placeholder="Search by guest name or room number..."
           onkeyup="filterTable('reservationSearch', 'reservationsTable')">
    <table class="table" id="reservationsTable">
        <thead><tr><th>ID</th><th>Guest</th><th>Room</th><th>Arrival</th><th>Action</th></tr></thead>
        <tbody>
        <tr th:each="r : ${reservations}" th:if="${r.status.name() == 'CONFIRMED'}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.guestName}"></td>
            <td th:text="${r.room.number}"></td>
            <td th:text="${r.arrival}"></td>
            <td>
                <form th:action="@{/frontoffice/reservations/{id}/check-in(id=${r.id})}" method="post">
                    <button class="btn btn-primary btn-sm">Check in booking</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="h4">Stay register</h2>
    <div class="table-responsive">
        <table class="table table-striped" id="staysTable">
            <thead><tr><th>Stay</th><th>Room</th><th>Guest</th><th>Departure</th><th>Balance</th><th>Status / action</th></tr></thead>
            <tbody>
            <tr th:each="s : ${stays}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.room.number}"></td>
                <td th:text="${s.guestName}"></td>
                <td th:text="${s.departure}"></td>
                <td th:text="${s.balance}"></td>
                <td>
                    <span th:if="${s.checkedOut}">Checked out</span>
                    <form th:unless="${s.checkedOut}" th:action="@{/frontoffice/{id}/check-out(id=${s.id})}" method="post">
                        <button class="btn btn-outline-primary btn-sm" th:disabled="${s.balance.signum() != 0}">Check out</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <script>
        function filterTable(inputId, tableId) {
            const input = document.getElementById(inputId).value.toLowerCase();
            const rows = document.querySelectorAll("#" + tableId + " tbody tr");
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(input) ? "" : "none";
            });
        }
    </script>

</main>
</body>
</html>
