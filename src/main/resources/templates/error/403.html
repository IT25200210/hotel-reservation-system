<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>403 Forbidden | Hotel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><main class="container py-5" style="max-width:720px">
<div class="card card-body shadow-sm">
<h1 class="h3">403 — Forbidden</h1>
<p class="text-muted">You are logged in, but your role cannot open this page.</p>
<ul class="list-group mb-3">
<li class="list-group-item">Status: <strong th:text="${status}">403</strong> (<span th:text="${error}">Forbidden</span>)</li>
<li class="list-group-item">Path: <code th:text="${path}">/finance</code></li>
<li class="list-group-item">Message: <span th:text="${message}">Access denied</span></li>
<li class="list-group-item">Time: <span th:text="${timestamp}">-</span></li>
</ul>
<div class="alert alert-info">Fix: logout and login with the right user. Finance page needs <code>finance</code>, reservations needs <code>reservations</code>, stock needs <code>inventory</code>.</div>
<div class="d-flex gap-2">
<a th:href="@{/login}" class="btn btn-primary">Go to login</a>
<form th:action="@{/logout}" method="post" class="d-inline">
<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<button class="btn btn-outline-secondary">Logout</button></form>
</div></div></main></body></html>
