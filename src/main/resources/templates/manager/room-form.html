<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Room Form | General Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Plus Jakarta Sans", sans-serif;
            color: #f7f7f9;
            background:
                    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
                    radial-gradient(circle at top left, rgba(145,154,171,.18), transparent 36rem),
                    #0d1016;
            background-size: 32px 32px, 32px 32px, auto;
        }

        .shell {
            width: min(850px, calc(100% - 48px));
            margin: 28px auto 40px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .brand-mark {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,.24);
            background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.04));
        }

        .brand-name {
            margin: 0;
            font-size: 1.55rem;
            font-weight: 800;
        }

        .brand-subtitle {
            margin: 3px 0 0;
            color: #a9b2c3;
        }

        .panel {
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 34px;
            background: linear-gradient(145deg, rgba(31,36,46,.92), rgba(20,24,32,.94));
            box-shadow: 0 24px 70px rgba(0,0,0,.34);
            overflow: hidden;
        }

        .panel-head {
            padding: 42px 50px 34px;
            border-bottom: 1px solid rgba(255,255,255,.12);
        }

        .eyebrow {
            margin: 0 0 18px;
            color: #c4cad7;
            font-size: .85rem;
            font-weight: 800;
            letter-spacing: .22rem;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.15rem);
            font-weight: 800;
        }

        .description {
            margin: 18px 0 0;
            color: #bec7d7;
        }

        .form-body {
            padding: 38px 50px 46px;
        }

        label {
            margin-bottom: 10px;
            color: #dce3ef;
            font-weight: 800;
        }

        label i {
            margin-right: 6px;
        }

        .form-control, .form-select {
            min-height: 56px;
            color: #fff;
            background-color: #303742;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 16px;
            font-weight: 600;
        }

        .form-control:focus, .form-select:focus {
            color: #fff;
            background-color: #353c48;
            border-color: rgba(255,255,255,.45);
            box-shadow: 0 0 0 .22rem rgba(255,255,255,.12);
        }

        .form-select option {
            color: #111827;
            background: #fff;
        }

        textarea.form-control {
            min-height: 110px;
        }

        .btn-metal, .btn-ghost {
            border-radius: 999px;
            font-weight: 800;
            padding: .72rem 1.1rem;
            border: 1px solid rgba(255,255,255,.18);
            text-decoration: none;
        }

        .btn-metal {
            color: #171b22;
            background: linear-gradient(180deg, #f8f9fc, #aeb6c5);
        }

        .btn-ghost {
            color: #f7f7f9;
            background: rgba(255,255,255,.07);
        }

        .error {
            color: #ffb4b4;
            margin-top: 8px;
            display: block;
            font-size: .9rem;
        }

        .alert-danger {
            color: #ffe2e2;
            background: rgba(255,107,107,.14);
            border-color: rgba(255,107,107,.35);
            border-radius: 18px;
        }

        .form-check-input {
            background-color: #303742;
            border-color: rgba(255,255,255,.25);
        }
    </style>
</head>
<body>
<main class="shell">

    <header class="brand">
        <div class="brand-mark">
            <i class="bi bi-door-open fs-3"></i>
        </div>
        <div>
            <p class="brand-name">The Grand Horizon</p>
            <p class="brand-subtitle">General Manager Room Management</p>
        </div>
    </header>

    <section class="panel">
        <div class="panel-head">
            <p class="eyebrow">Room Details</p>
            <h1 th:text="${room.id != null ? 'Edit Room' : 'Add Room'}">Add Room</h1>
            <p class="description">Rooms saved here will appear in the reservations room dropdown.</p>
        </div>

        <form th:action="@{/manager/room/save}" th:object="${room}" method="post" class="form-body">
            <input type="hidden" th:field="*{id}">

            <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>

            <div class="mb-4">
                <label for="number"><i class="bi bi-hash"></i>Room Number</label>
                <input id="number" type="text" th:field="*{number}" class="form-control" placeholder="Example: 101">
                <span class="error" th:if="${#fields.hasErrors('number')}" th:errors="*{number}"></span>
            </div>

            <div class="mb-4">
                <label for="type"><i class="bi bi-grid"></i>Room Type</label>
                <select id="type" th:field="*{type}" class="form-select">
                    <option th:each="roomType : ${roomTypes}"
                            th:value="${roomType}"
                            th:text="${roomType}">
                    </option>
                </select>
                <span class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
            </div>

            <div class="mb-4">
                <label for="nightlyRate"><i class="bi bi-cash"></i>Nightly Rate</label>
                <input id="nightlyRate" type="number" step="0.01" min="0.01" th:field="*{nightlyRate}" class="form-control" placeholder="Example: 15000.00">
                <span class="error" th:if="${#fields.hasErrors('nightlyRate')}" th:errors="*{nightlyRate}"></span>
            </div>

            <div class="mb-4">
                <label for="capacity"><i class="bi bi-people"></i>Capacity</label>
                <input id="capacity" type="number" min="1" th:field="*{capacity}" class="form-control" placeholder="Example: 2">
                <span class="error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></span>
            </div>


            <div class="form-check mb-4">
                <input id="active" type="checkbox" th:field="*{active}" class="form-check-input">
                <label for="active" class="form-check-label">Active room</label>
            </div>

            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-metal">
                    <i class="bi bi-check2-circle me-1"></i> Save Room
                </button>

                <a th:href="@{/manager/rooms}" class="btn btn-ghost">
                    Cancel
                </a>
            </div>
        </form>
    </section>

</main>
</body>
</html>
