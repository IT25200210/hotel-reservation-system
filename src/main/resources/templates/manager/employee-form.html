<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details | The Grand Horizon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme:dark; --text:#f4f5f7; --muted:#a2a9b4; --line:rgba(255,255,255,.12); }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; color:var(--text); font-family:'Plus Jakarta Sans',sans-serif; background-color:#111419; background-image:radial-gradient(ellipse at 50% 0%,rgba(105,116,134,.16),transparent 65%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px); background-size:100% 100%,24px 24px,24px 24px; }
        .shell { width:min(1120px,calc(100% - 40px)); margin:40px auto; }
        .brandbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:32px; }
        .brand { display:flex; align-items:center; gap:16px; }
        .crest { width:60px; height:60px; display:grid; place-items:center; flex-shrink:0; border-radius:18px; border:1px solid rgba(255,255,255,.35); background:linear-gradient(145deg,#454950,#22262d); box-shadow:inset 0 1px 1px #c0c3c8,0 8px 24px #0004; }
        .brand-name { font-family:'Sora',sans-serif; font-size:20px; font-weight:700; letter-spacing:-.6px; }
        .subtitle { color:var(--muted); font-size:13px; margin:5px 0 0; }
        .role { font-size:12px; color:#d6dbe2; border:1px solid var(--line); padding:9px 14px; border-radius:999px; white-space:nowrap; }
        .panel { background:linear-gradient(135deg,rgba(35,39,46,.97),rgba(20,24,31,.98)); border:1px solid var(--line); border-radius:24px; box-shadow:0 22px 70px #0005; overflow:hidden; }
        .panel-head { padding:32px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
        .eyebrow { font-size:11px; font-weight:700; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:10px; }
        h1 { font-family:'Sora',sans-serif; font-size:clamp(23px,4vw,30px); font-weight:700; letter-spacing:-1px; margin:0; }
        .description { color:var(--muted); font-size:14px; margin:10px 0 0; line-height:1.7; }
        .action { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 19px; border:1px solid rgba(255,255,255,.38); border-radius:999px; color:#fff; font:600 13px 'Plus Jakarta Sans',sans-serif; text-decoration:none; cursor:pointer; background:linear-gradient(180deg,#454951,#343840); box-shadow:inset 0 1px 1px #ffffff65,0 4px 12px #0002; transition:background .15s,transform .15s; }
        .action:hover { color:#fff; background:#50555e; transform:translateY(-1px); }
        .action.secondary { background:transparent; box-shadow:none; border-color:var(--line); color:#d2d6dd; }
        .action.danger { color:#ffaaa6; background:rgba(255,69,58,.08); border-color:rgba(255,105,97,.25); box-shadow:none; }
        .action.small { padding:7px 12px; font-size:12px; }
        a:focus-visible,button:focus-visible { outline:3px solid #cbd5e1; outline-offset:4px; }
        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; min-width:650px; }
        th { padding:18px 24px; color:var(--muted); font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; background:#ffffff03; border-bottom:1px solid var(--line); }
        td { padding:20px 24px; font-size:14px; border-bottom:1px solid rgba(255,255,255,.06); }
        tbody tr:last-child td { border-bottom:0; } tbody tr:hover { background:rgba(255,255,255,.025); }
        .mono { font-family:'JetBrains Mono',monospace; font-size:12px; color:#bbc4cf; }
        .employee-name { font-weight:600; }.number { text-align:right; white-space:nowrap; }.actions { display:flex;gap:8px; }
        .empty { padding:52px 24px; text-align:center; color:var(--muted); }.empty i { display:block; font-size:30px; margin-bottom:14px; color:#cbd5e1; }
        .form-shell { max-width:760px; }.form-body { padding:32px; }.field { margin-bottom:26px; }
        label { display:block; color:#c3cad3; font-size:13px; font-weight:600; margin-bottom:10px; }
        label i { margin-right:7px; color:#8f9aaa; }
        input:not([type=hidden]) { width:100%; padding:14px 16px; color:#f4f5f7; font:500 14px 'Plus Jakarta Sans',sans-serif; border-radius:11px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.065); box-shadow:inset 0 2px 4px #0002; outline:none; }
        input::placeholder { color:#8d97a6; } input:focus { border-color:#c1c6ce; background:#ffffff0e; box-shadow:0 0 0 3px #ffffff1c; }
        .error { color:#ffaaa6; display:block; margin-top:8px; font-size:12px; }.invalid { border-color:#ffaaa6!important; }
        .form-actions { display:flex; flex-wrap:wrap; gap:12px; border-top:1px solid var(--line); padding-top:24px; margin-top:8px; }
        .back { display:inline-flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; text-decoration:none; margin-bottom:20px; }.back:hover { color:white; }
        @media(max-width:600px) { .shell { width:calc(100% - 24px); margin:22px auto; }.brandbar { align-items:flex-start; margin-bottom:24px; }.brand-name {font-size:16px;}.subtitle {font-size:11px;}.role {display:none;}.crest {width:48px;height:48px;border-radius:14px;}.panel-head,.form-body {padding:24px 20px;}.panel-head>.action {width:100%;}.form-actions>.action {flex:1;} }
        @media(prefers-reduced-motion:reduce) { * {transition:none!important;} }
    </style>
</head>
<body>
<div class="shell form-shell">
    <header class="brandbar">
        <div class="brand"><div class="crest" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 2.5L33.5 11.5V24.5L18 33.5L2.5 24.5V11.5L18 2.5Z" stroke="url(#login-emblem-grad)" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M18 6.5L29.5 13.2V22.8L18 29.5L6.5 22.8V13.2L18 6.5Z" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-linejoin="round"/>
            <path d="M7 18H29" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M13.5 13V23M18 10V26M22.5 13V23" stroke="url(#login-emblem-grad)" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M14.5 10L18 6L21.5 10" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
                <linearGradient id="login-emblem-grad" x1="2.5" y1="2.5" x2="33.5" y2="33.5" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#ffffff"/>
                    <stop offset="0.5" stop-color="#cbd5e1"/>
                    <stop offset="1" stop-color="#94a3b8"/>
                </linearGradient>
            </defs>
        </svg></div>
            <div><div class="brand-name">The Grand Horizon</div>
                <p class="subtitle">Operations &amp; Staff Management Console</p></div>
        </div>
        <span class="role">General Manager</span>
    </header>

    <a th:href="@{/manager/dashboard}" class="back"><i class="bi bi-arrow-left" aria-hidden="true"></i>Back to staff management</a>
    <main class="panel">
        <div class="panel-head"><div><div class="eyebrow">Employee details</div>
            <h1 th:text="${employee.id != null ? 'Edit employee' : 'Add employee'}">Save employee details</h1>
            <p class="description">Keep your staff records accurate and up to date.</p>
        </div></div>
        <form th:action="@{/manager/employee/save}" th:object="${employee}" method="post" class="form-body">
            <input type="hidden" th:field="*{id}">
            <div class="field">
                <label for="name"><i class="bi bi-person" aria-hidden="true"></i>Full name</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Enter employee name" th:errorclass="invalid" aria-describedby="name-error">
                <span id="name-error" class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div class="field">
                <label for="position"><i class="bi bi-briefcase" aria-hidden="true"></i>Position</label>
                <input id="position" type="text" th:field="*{position}" placeholder="Enter job title" th:errorclass="invalid" aria-describedby="position-error">
                <span id="position-error" class="error" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></span>
            </div>
            <div class="field">
                <label for="salary"><i class="bi bi-wallet2" aria-hidden="true"></i>Salary</label>
                <input id="salary" type="number" step="0.01" th:field="*{salary}" placeholder="Enter salary amount" th:errorclass="invalid" aria-describedby="salary-error">
                <span id="salary-error" class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
            </div>
            <div class="form-actions">
                <button type="submit" class="action"><i class="bi bi-check2-circle" aria-hidden="true"></i>Save Employee</button>
                <a th:href="@{/manager/dashboard}" class="action secondary">Cancel</a>
            </div>
        </form>
    </main>

</div>
</body>
</html>
