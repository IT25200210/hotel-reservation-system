<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Audit Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Hotel Admin - Audit Logs</span>
        <a th:href="@{/admin/users}" class="btn btn-outline-light btn-sm">Back to Users</a>
    </div>
</nav>
<div class="container">
    <h2>Audit Log</h2>
    <table class="table table-sm table-bordered table-striped mt-3">
        <thead class="table-dark">
        <tr>
            <th>Time</th>
            <th>User</th>
            <th>Action</th>
            <th>Entity</th>
            <th>ID</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
            <td th:text="${log.createdAt}"></td>
            <td th:text="${log.username}"></td>
            <td th:text="${log.action}"></td>
            <td th:text="${log.entityName}"></td>
            <td th:text="${log.entityId}"></td>
            <td th:text="${log.details}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
