<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · User Account Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/housekeeping.css}" rel="stylesheet">
</head>
<body>

<!-- Apple Frosted Glass Navbar -->
<nav class="navbar navbar-dark hk-navbar">
    <div class="container-fluid">
        <a th:href="@{/admin/users}" class="navbar-brand text-decoration-none">
            <span class="hk-brand-crest"><i class="bi bi-shield-lock-fill"></i></span>
            <span>The Grand Horizon <span class="badge bg-white text-dark rounded-pill ms-2 fw-semibold" style="font-size: 0.72rem;">System Admin</span></span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/admin/users}" class="btn btn-sm hk-nav-btn"><i class="bi bi-arrow-left me-1"></i>Back to Users</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="card hk-card form-card border-0 shadow-lg hk-fade-in">
        <div class="card-body p-4">
            
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom border-white border-opacity-10">
                <div class="stat-icon neutral">
                    <i class="bi" th:classappend="${user.id == null} ? 'bi-person-plus' : 'bi-pencil-square'"></i>
                </div>
                <div>
                    <h3 class="page-title fs-4" th:text="${user.id == null} ? 'Create Staff Account' : 'Edit Staff Account'"></h3>
                    <p class="text-secondary small mb-0">Configure user credentials, permissions, and departmental role</p>
                </div>
            </div>

            <form th:action="${user.id == null} ? @{/admin/users} : @{/admin/users/update/{id}(id=${user.id})}"
                  th:object="${user}" method="post">
                
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-at text-white"></i>Username</label>
                    <input type="text" th:field="*{username}" class="form-control font-monospace"
                           th:readonly="${user.id != null}" placeholder="e.g. jsmith or hk_lead" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-key text-white"></i>Password</label>
                    <input type="password" th:field="*{password}" class="form-control"
                           th:placeholder="${user.id != null} ? 'Leave blank to preserve current password' : 'Enter strong password'"
                           th:required="${user.id == null}">
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person text-white"></i>Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control"
                           placeholder="e.g. Johnathan Smith" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-envelope text-white"></i>Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           placeholder="staff@grandhorizonhotel.com">
                </div>

                <div class="mb-4">
                    <label class="form-label"><i class="bi bi-shield-check text-white"></i>Departmental Role</label>
                    <select name="roleId" class="form-select" required>
                        <option th:each="r : ${roles}" th:value="${r.id}"
                                th:text="${r.name + ' — ' + r.description}"
                                th:selected="${user.role != null and user.role.id == r.id}"></option>
                    </select>
                </div>

                <div class="d-flex gap-2 pt-2">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check-lg me-1"></i>Save Account
                    </button>
                    <a th:href="@{/admin/users}" class="btn btn-outline-light px-3">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/housekeeping.js}"></script>
</body>
</html>
