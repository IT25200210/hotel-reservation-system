<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Hotel Admin</span>
        <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>User Accounts</h2>
        <a th:href="@{/admin/users/new}" class="btn btn-primary">+ Add User</a>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.fullName}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.role.name}"></td>
            <td>
                <span th:if="${u.status == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                <span th:if="${u.status != 'ACTIVE'}" class="badge bg-danger">DEACTIVATED</span>
            </td>
            <td>
                <a th:href="@{/admin/users/edit/{id}(id=${u.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:if="${u.status == 'ACTIVE'}"
                   th:href="@{/admin/users/deactivate/{id}(id=${u.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Deactivate this user?')">Deactivate</a>
                <a th:if="${u.status != 'ACTIVE'}"
                   th:href="@{/admin/users/activate/{id}(id=${u.id})}"
                   class="btn btn-sm btn-success">Activate</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
